# Capa perimetral: limita tasa de conexiones/peticiones antes de llegar a Node
limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=perip:10m;

server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Mitigación Slowloris / cuerpos enormes
  client_body_timeout 10s;
  client_header_timeout 10s;
  send_timeout 15s;
  client_max_body_size 16k;
  limit_conn perip 30;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy no-referrer always;
  add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; connect-src 'self'; worker-src 'self'; frame-ancestors 'none'" always;

  location /api/ {
    limit_req zone=api burst=30 nodelay;
    proxy_pass http://backend:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;   # sobrescribe: no se confía en el cliente
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 15s;
  }

  location = /sw.js { add_header Cache-Control "no-cache"; try_files $uri =404; }

  location / { try_files $uri /index.html; }
}
